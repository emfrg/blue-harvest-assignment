[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["local", "_reference"]

[tool.ruff.lint]
# Check common mistakes, import ordering and likely bugs.
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Path"]

[tool.mypy]
python_version = "3.13"
files = ["app", "tests"]
plugins = ["pydantic.mypy"]
strict = true
disallow_any_explicit = true
disallow_any_unimported = true
warn_unreachable = true

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true
