# From the repository root:
# uv sync --locked
# uv run pre-commit install
# Run all checks: uv run pre-commit run --all-files
# Fix formatting: uv run ruff format app tests

# Use the locked project environment without changing the files being checked.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff formatting
        entry: uv run --locked ruff format --check app tests
        language: unsupported
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: Ruff linting
        entry: uv run --locked ruff check app tests
        language: unsupported
        pass_filenames: false
        always_run: true
      - id: mypy
        name: mypy type checking
        entry: uv run --locked mypy
        language: unsupported
        pass_filenames: false
        always_run: true
